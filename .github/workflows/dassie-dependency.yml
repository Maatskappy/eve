name: Dassie dependency

on:
  pull_request:
    branches: [dassie/1.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter eve build
      - run: pnpm --filter eve exec tsc --noEmit
      - run: pnpm --filter eve test:unit
      - run: pnpm guard:invariants
      - run: pnpm docs:check
      - name: Verify callback data, its receipt and the stream cursor read
        run: pnpm --filter eve exec vitest run --config vitest.integration.config.ts src/execution/session/callback-data.integration.test.ts
