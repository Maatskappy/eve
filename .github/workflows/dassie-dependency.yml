name: Dassie dependency

on:
  pull_request:
    branches: [dassie/0.72]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter eve build
      - run: pnpm --filter eve exec tsc --noEmit
      - run: pnpm --filter eve exec tsc -p tsconfig.build.json
      - run: pnpm --filter eve test:unit
      - run: pnpm guard:invariants
      - run: pnpm docs:check
      - name: Verify native callback lifecycle
        run: pnpm --filter eve exec vitest run --config vitest.integration.config.ts src/execution/session/entry.integration.test.ts -t 'committed callback data|retired session|acknowledgement publication fails'
      - name: Verify mounted extension context
        run: pnpm --filter eve exec vitest run --config vitest.integration.config.ts src/compiler/mounted-extension.integration.test.ts -t 'keeps state independent'
      - name: Verify authored public API
        env:
          EVE_E2E_MODEL: mock
        run: pnpm --filter agent-basic-runtime exec eve eval runtime/callback-context --strict --verbose
